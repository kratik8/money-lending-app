# ==============================================================================
# Nginx Reverse Proxy Configuration for Fundify
# Target Server: Ubuntu EC2 / Production Linux Server
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your domain name or EC2 public IP/DNS

    # Max body size for database uploads/restores (matches Node app 10MB limit)
    client_max_body_size 10M;

    # Reverse Proxy all web & API traffic to the Docker Container running on port 5000
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Header forwarding for real IP tracking and SSL/protocol integrity
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if real-time updates are enabled in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
