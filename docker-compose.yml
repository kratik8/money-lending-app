version: '3.8'

services:
  # Node.js Fundify Money Lending Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: money-lending-app:latest
    container_name: fundify-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - fundify-data:/app/data

  # Nginx Reverse Proxy Server
  nginx:
    image: nginx:alpine
    container_name: fundify-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  fundify-data:
    driver: local
